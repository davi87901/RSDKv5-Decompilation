name: Build Sonic Mania Android

on:
  workflow_dispatch:
    inputs:
      plus:
        description: "Compilar com Plus (marque só se o seu Data.rsdk for do Mania Plus)"
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: RSDKModding/Sonic-Mania-Decompilation
          path: Sonic-Mania-Decompilation

      - uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-Example-Mods
          path: RSDKv5-Example-Mods

      - uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv5-GameAPI
          path: RSDKv5-GameAPI

      - name: Baixar libogg e libtheora
        working-directory: ./dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip
          unzip \*.zip
          rm *.zip
          rsync -ar libogg-*/* libogg
          mv libtheora-* libtheora

      - name: Ligar as pastas
        run: |
          ln -s $PWD $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5
          ln -s $PWD/RSDKv5-GameAPI RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          ln -s $PWD/RSDKv5-GameAPI RSDKv5-Example-Mods/UltrawideMania/GameAPI
          ln -sfn $PWD/Sonic-Mania-Decompilation ./android/app/jni/Game
          ln -sfn $PWD/RSDKv5-GameAPI ./android/app/jni/GameAPI
          ln -sfn $PWD/RSDKv5-Example-Mods/ManiaTouchControls ./android/app/jni/MTC
          ln -sfn $PWD/RSDKv5-Example-Mods/UltrawideMania ./android/app/jni/UWM

      - uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Compilar
        working-directory: ./android
        run: |
          ./gradlew assemble --no-daemon -PABIFILTERS="arm64-v8a;armeabi-v7a" ${{ inputs.plus == false && '-PRETRO_DISABLE_PLUS' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: sonic-mania-android
          path: android/app/build/outputs/apk/**/*.apk
